# The documentation site: documentation/ built by MkDocs Material (.config/mkdocs/), published
# on GitHub Pages at https://cavo789.github.io/media-hygiene/ — the links the tool prints.
#
# Needs, once: repository Settings → Pages → Source: GitHub Actions. Pull requests only build
# (strict: a broken link or anchor fails); main deploys.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "documentation/**"
      - ".config/mkdocs/**"
      - ".github/workflows/docs.yml"
      - "pyproject.toml"
      - "uv.lock"
  pull_request:
    paths:
      - "documentation/**"
      - ".config/mkdocs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

env:
  NO_MKDOCS_2_WARNING: "true" # Material's banner about MkDocs 2.0: mkdocs is pinned below 2

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the documentation tools
        run: uv sync --locked --only-group docs
      - name: Build (strict)
        run: uv run --no-sync mkdocs build --config-file .config/mkdocs/mkdocs.yml --site-dir "$RUNNER_TEMP/site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request'
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Publish on GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
