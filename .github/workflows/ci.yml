# Quality gate on every push and pull request; on a vX.Y.Z tag, also publish the image.
#
# Publishing needs two repository secrets: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (a Docker Hub
# access token with read/write scope). The `release` devcontainer helper creates the tag.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  # A fork publishes under its own account by setting this repository variable.
  IMAGE: ${{ vars.DOCKER_HUB_NAMESPACE || 'cavo789' }}/media-hygiene
  # ffmpeg for the tests, a static build pinned by its digest and kept in the Actions cache:
  # `apt-get install ffmpeg` hung on Ubuntu's mirror (31 min in run 40397484657). A month-end
  # autobuild of BtbN/FFmpeg-Builds, the ones that stay published; libx264, aac and mjpeg in.
  FFMPEG_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-09-30-13-08/ffmpeg-n8.1.3-9-g29e619e767-linux64-gpl-8.1.tar.xz
  FFMPEG_SHA256: 97ce978979194b5cf7e06a5e68020dbdaa7a4f3294c5452b6a1bc347100dbb79

# Runners pinned to Ubuntu 26.04, which `ubuntu-latest` becomes on 2026-10-19: the gate is
# proven on it beforehand, and a later image change is a deliberate edit, never a surprise.
jobs:
  # Lint and tests in parallel (≈ 110 s and ≈ 145 s on the runner, measured): the image
  # jobs wait for the longer of the two instead of their sum.
  lint:
    name: Lint, types
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the locked environment
        run: uv sync --locked
      # mypy rechecks only what changed since the cached run: a new key per commit, the
      # latest cache of the branch (or of main) restored.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('uv.lock', 'pyproject.toml') }}-${{ github.sha }}
          restore-keys: mypy-${{ hashFiles('uv.lock', 'pyproject.toml') }}-
      # Stage manual: the duplicate-code checks too, left out of local commits.
      - name: Pre-commit hooks (ruff, mypy, pylint, shellcheck, shfmt, hadolint)
        run: >-
          uv run pre-commit run --all-files --hook-stage manual --show-diff-on-failure
          --config .config/.pre-commit-config.yaml

  tests:
    name: Tests
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - name: Install the locked environment
        run: uv sync --locked
      # ffmpeg writes the test videos (inventory, sort of the docs library, re-encoded copies),
      # as in the devcontainer; the tool itself only warns when it is missing.
      - &ffmpeg-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/ffmpeg
          key: ffmpeg-${{ env.FFMPEG_SHA256 }}
      - &ffmpeg-install
        name: Install ffmpeg (static, pinned, cached)
        timeout-minutes: 3
        run: |
          dir="$HOME/.local/ffmpeg"
          if [[ ! -x "$dir/ffprobe" ]]; then
            curl -fsSL --retry 3 --max-time 120 -o "$RUNNER_TEMP/ffmpeg.tar.xz" "$FFMPEG_URL"
            echo "$FFMPEG_SHA256  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum --check -
            mkdir -p "$dir"
            tar -xJf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$dir" --strip-components=2 \
              --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
          fi
          echo "$dir" >>"$GITHUB_PATH"
          "$dir/ffmpeg" -hide_banner -version | head -n 1
      - name: Tests with coverage
        # -n auto: one worker per vCPU of the runner (4); the devcontainer stays serial
        # (`tests`, `check`), as the maintainer's PC suffers under load.
        run: uv run pytest -n auto --cov --cov-report=term-missing:skip-covered

  image:
    name: Image end-to-end tests
    needs: [lint, tests]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build media-hygiene:latest (amd64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Like the `e2e` helper: the local target names media-hygiene in its commands.
          target: local
          load: true
          tags: media-hygiene:latest
          cache-from: type=gha,scope=linux-amd64
          cache-to: type=gha,mode=max,scope=linux-amd64
      - name: Install the locked environment
        run: uv sync --locked
      # ffmpeg writes the demo videos: the image's own ffprobe must tell the truncated one.
      - *ffmpeg-cache
      - *ffmpeg-install
      - name: End-to-end tests (real docker run)
        # A folder of the runner's own disk: Docker bind-mounts it, which the
        # devcontainer's volume cannot offer (0189: launcher --photos, mh folders add).
        env:
          MEDIA_HYGIENE_E2E_HOST_DIR: ${{ runner.temp }}
          # The pages in Chromium (Playwright image, 0366): here only, never on the PC.
          MEDIA_HYGIENE_E2E_BROWSER: "1"
        run: uv run pytest -m e2e

  # One native build per platform, in parallel with the end-to-end tests: arm64 on an ARM
  # runner, never emulated (QEMU took half an hour to compile ffmpeg). On a vX.Y.Z tag each
  # pushes its image by digest only; `publish` names them once the end-to-end tests pass. On
  # main they build without pushing: arm64 is proven buildable before any release.
  build-amd64:
    name: Image amd64
    needs: [lint, tests]
    runs-on: ubuntu-26.04
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps: &build-steps
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Version (on a tag, it must match pyproject.toml)
        id: version
        env:
          REF: ${{ github.ref }}
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)"
          if [[ "${REF}" == refs/tags/v* && "${TAG}" != "v${version}" ]]; then
              echo "::error::Tag ${TAG} does not match pyproject.toml version ${version}"
              exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "platform=$(uname -m | sed 's/x86_64/amd64/; s/aarch64/arm64/')" >> "${GITHUB_OUTPUT}"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build (and on a tag push by digest), with SBOM and provenance
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          # Never the default (last) target `local`: that one names media-hygiene, not this image.
          target: published
          platforms: linux/${{ steps.version.outputs.platform }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=${{ startsWith(github.ref, 'refs/tags/v') }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=linux-${{ steps.version.outputs.platform }}
          cache-to: type=gha,mode=max,scope=linux-${{ steps.version.outputs.platform }}

  build-arm64:
    name: Image arm64
    needs: [lint, tests]
    runs-on: ubuntu-26.04-arm
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps: *build-steps

  publish:
    name: Publish to Docker Hub
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [image, build-amd64, build-arm64]
    runs-on: ubuntu-26.04
    permissions:
      contents: write # the GitHub Release of the tag, its last step
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Name both platforms :<version> and :latest
        env:
          TAG: ${{ github.ref_name }}
          AMD64: ${{ needs.build-amd64.outputs.digest }}
          ARM64: ${{ needs.build-arm64.outputs.digest }}
        run: |
          version="${TAG#v}"
          docker buildx imagetools create \
              --tag "${IMAGE}:${version}" --tag "${IMAGE}:latest" \
              "${IMAGE}@${AMD64}" "${IMAGE}@${ARM64}"
          docker buildx imagetools inspect "${IMAGE}:${version}"
      # The Docker Hub overview is README.md, relative links made absolute (GitHub, this tag);
      # the short description is the image's OCI description. Needs a token with the
      # read/write/delete scope.
      - name: Read the short description from the Dockerfile
        id: about
        run: |
          short="$(sed -n 's/.*org\.opencontainers\.image\.description="\([^"]*\)".*/\1/p' Dockerfile)"
          echo "short=${short}" >> "${GITHUB_OUTPUT}"
      - name: Publish README.md as the Docker Hub overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ env.IMAGE }}
          short-description: ${{ steps.about.outputs.short }}
          readme-filepath: ./README.md
          enable-url-completion: true
      # The notes of the version, once its image is published: GitHub's own, from the pull
      # requests and commits since the previous tag; `mh update` links them (0187). A re-run
      # finds the release and leaves it as it is.
      - name: GitHub Release with notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              echo "Release ${TAG} exists already: left as it is."
          else
              gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" \
                  --title "${TAG}" --generate-notes --verify-tag
          fi
