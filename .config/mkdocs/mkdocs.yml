# The documentation site: documentation/ built by MkDocs Material, published on GitHub Pages
# (.github/workflows/docs.yml). Preview: the `docs_serve` helper; check: `docs_build`.
# Every page of documentation/en is listed in `nav` (tests/unit/test_docs_site.py checks it).
site_name: media-hygiene
site_url: https://cavo789.github.io/media-hygiene/
site_description: Find and safely clean duplicate photos and videos, then sort them.
repo_url: https://github.com/cavo789/media-hygiene
repo_name: cavo789/media-hygiene
edit_uri: edit/main/documentation/
docs_dir: ../../documentation
site_dir: /tmp/media-hygiene/site
strict: true

theme:
  name: material
  custom_dir: overrides  # theme.css (Material onto the tool's tokens), guide.css, main.html
  language: en
  font: false  # the tool's own fonts (hooks.py publishes them), never Google's
  logo: images/avatar.webp  # the meerkat, published by hooks.py from the tool's assets
  favicon: images/favicon.png
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Light mode

extra_css:
  - stylesheets/tokens.css  # the tool's own tokens, published by hooks.py
  - stylesheets/theme.css
  - stylesheets/guide.css

hooks:
  - hooks.py

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fr
          name: Français
          build: true
          site_description: Trouver et nettoyer sans risque les photos et vidéos en double, puis les trier.
          nav_translations:
            In short: En bref
            Start here: Pour commencer
            Clean the duplicates: Nettoyer les doublons
            Sort the photos: Trier les photos
            Commands: Commandes
            Reference: Référence

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

nav:
  - README.md
  - In short:
      - clean/quick-guide.md
      - sort/quick-guide.md
      - find/quick-guide.md
  - Start here:
      - start/00-install-docker.md
      - start/01-first-audit.md
      - start/02-keep-the-cache.md
      - start/03-several-folders.md
  - Clean the duplicates:
      - clean/04-html-report.md
      - clean/05-choose-the-kept-copy.md
      - clean/06-file-types.md
      - clean/07-configuration-file.md
      - clean/08-clean.md
      - clean/09-undo-history-purge.md
      - clean/10-review-bursts.md
      - clean/11-near-duplicates.md
      - clean/12-decide-pair-by-pair.md
      - clean/13-second-opinion.md
      - clean/14-unwanted-photos.md
  - Sort the photos:
      - sort/04-classify.md
      - sort/05-review-the-proposal.md
      - sort/06-write-down-what-you-know.md
      - sort/07-sort.md
      - sort/08-subjects-from-a-local-model.md
      - sort/09-places-from-gps.md
      - sort/10-sort-by-person.md
      - sort/11-name-events-in-the-browser.md
      - sort/12-albums.md
  - Commands:
      - reference-commands.md
      - commands/album.md
      - commands/audit.md
      - commands/push.md
      - commands/browse.md
      - commands/classify.md
      - commands/clean.md
      - commands/config.md
      - commands/crosscheck.md
      - commands/history.md
      - commands/home.md
      - commands/import.md
      - commands/inventory.md
      - commands/launcher.md
      - commands/menu.md
      - commands/people.md
      - commands/places.md
      - commands/purge.md
      - commands/reports.md
      - commands/review-sort.md
      - commands/review.md
      - commands/search.md
      - commands/share.md
      - commands/shrink.md
      - commands/slideshow.md
      - commands/sort.md
      - commands/status.md
      - commands/tags.md
      - commands/undo.md
      - commands/xmp.md
  - Reference:
      - reference-advanced.md
      - reference-glossary.md
      - reference-inventory.md
      - reference-mount-points.md
      - reference-people.md
      - reference-safety.md
      - reference-sidecars.md
      - reference-tags.md
      - reference-troubleshooting.md
  - development.md
