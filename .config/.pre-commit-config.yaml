# Quality gate run on every commit and by the `check` helper (pre-commit run --all-files).
# Python tools run from the project virtual environment (`language: system`), so their versions
# come from uv.lock — one source of truth for the editor, the hooks and CI.
# `git push` runs only the duplicate-code checks (stage pre-push, below): the other hooks
# already ran at each commit.
default_install_hook_types: [pre-commit, pre-push]
default_stages: [pre-commit, manual]
fail_fast: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        # The GeoNames towns (~1.7 MB, xz) and landmarks (~4.2 MB, xz, 0472) are shipped
        # on purpose: offline geocoding.
        exclude: ^src/media_hygiene/geo/data/(towns|landmarks)\.tsv\.xz$
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      # gettext catalogs are written by pybabel (i18n_update): its layout is the reference.
      # Vendored files (Leaflet) stay byte for byte as published.
      - id: end-of-file-fixer
        exclude: \.pot?$|^src/media_hygiene/places/static/
      - id: mixed-line-ending
        args: [--fix=lf]
        exclude: ^src/media_hygiene/places/static/
      - id: trailing-whitespace
        exclude: \.pot?$|^src/media_hygiene/places/static/

  - repo: https://github.com/AleksaC/hadolint-py
    rev: v2.15.1
    hooks:
      - id: hadolint
        files: (^|/)Dockerfile$

  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: ruff format --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-check
        name: ruff check
        entry: ruff check --force-exclude --fix --exit-non-zero-on-fix
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy (strict)
        # Every tracked file (the `files` of pyproject.toml, minus untracked work in
        # progress, which pre-commit does not stash and CI never sees); the `lint`
        # helper sets LINT_UNTRACKED to check new files too.
        entry: >-
          bash -c 'git ls-files -z --cached ${LINT_UNTRACKED:+--others --exclude-standard} -- "src/*.py" "src/*.pyi" "tests/*.py"
          | xargs -0 mypy'
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: pylint
        name: pylint (200 lines/file, 3 args/function)
        entry: pylint
        language: system
        types: [python]
        files: ^src/
        require_serial: true
      - id: pylint-tests
        name: pylint (tests)
        # pytest injects fixtures by parameter name (redefined-outer-name), test helpers
        # keep one-line docstrings (no parameter/return sections), and a test module has
        # no line cap (too-many-lines): splitting the tests of one module costs more than
        # it gains.
        entry: >-
          pylint --disable=redefined-outer-name,too-many-lines,missing-param-doc,missing-type-doc,missing-return-doc,missing-raises-doc,missing-yield-doc
        language: system
        types: [python]
        files: ^tests/
        require_serial: true
      # duplicate-code compares the files pylint is given with each other, so these two
      # run that one check over every tracked file; untracked work in progress is left
      # out, as CI never sees it (the `lint` helper sets LINT_UNTRACKED to check new files
      # too). Not at each commit (≈ 17 s for src/ alone, measured in the devcontainer):
      # at each `git push` (stage pre-push: a new file repeating an unchanged one failed
      # CI twice, the commit hook only compares the changed files), and where
      # `--hook-stage manual` is passed: `lint`, `check`, CI. cyclic-import rides along
      # for the same reason (a cycle shows only when pylint sees all of its modules): one
      # parse for both, +2.5 to 4 s measured, against 6 s as a hook of its own.
      - id: pylint-duplicates
        name: pylint duplicate-code + cyclic-import (all of src)
        entry: >-
          bash -c 'git ls-files -z --cached ${LINT_UNTRACKED:+--others --exclude-standard} -- "src/*.py"
          | xargs -0 pylint --disable=all --enable=duplicate-code,cyclic-import'
        language: system
        types: [python]
        files: ^src/
        pass_filenames: false
        require_serial: true
        stages: [manual, pre-push]
      - id: pylint-duplicates-tests
        name: pylint duplicate-code (all of tests)
        entry: >-
          bash -c 'git ls-files -z --cached ${LINT_UNTRACKED:+--others --exclude-standard} -- "tests/*.py"
          | xargs -0 pylint --disable=all --enable=duplicate-code,cyclic-import'
        language: system
        types: [python]
        files: ^tests/
        pass_filenames: false
        require_serial: true
        stages: [manual, pre-push]
      - id: shellcheck
        name: shellcheck
        entry: shellcheck --external-sources
        language: system
        types: [shell]
      - id: shfmt
        name: shfmt
        entry: shfmt --write --indent 4 --case-indent
        language: system
        types: [shell]
        # Scripts vendored verbatim from the upstream tooling repository keep their formatting.
        exclude: ^\.claude/
